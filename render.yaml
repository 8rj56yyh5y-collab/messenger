# Постоянная ссылка на Render.com (Blueprint): Dashboard → New → Blueprint → выбрать этот репозиторий.
# Тариф Starter + диск 1 ГБ: работает 24/7, переписка и файлы сохраняются.
# Бесплатный тариф без диска не подходит: при перезапуске теряются все данные.
services:
  - type: web
    name: gobsek-chat
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "npm install --omit=dev"
    startCommand: npm start
    healthCheckPath: /api/meta
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: COMPANY_NAME
        value: Gobsek
      # Первый администратор (иначе мастер первого запуска в браузере):
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # ИИ-помощник (необязательно):
      - key: ANTHROPIC_API_KEY
        sync: false
      # Вход через Gobsek (необязательно, см. docs/GOBSEK_INTEGRATION.md):
      - key: GOBSEK_SSO_SECRET
        sync: false
      - key: GOBSEK_SSO_URL
        sync: false
      - key: GOBSEK_URL
        sync: false
      # События в Gobsek и push (необязательно):
      - key: GOBSEK_EVENTS_URL
        sync: false
      - key: GOBSEK_EVENTS_SECRET
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # TURN для звонков из закрытых сетей (необязательно):
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
